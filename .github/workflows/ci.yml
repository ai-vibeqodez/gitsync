name: CI

on:
  push:
    branches: [ main ]
    tags-ignore: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  fast:
    name: PR Fast Checks
    uses: ai-warevo/.github/.github/workflows/reusable-pr-fast.yml@main
    with:
      make_target: ci-fast

  coverage:
    name: Coverage Report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ai-warevo/.github/.github/workflows/reusable-coverage-badge.yml@main
    with:
      make_target: ci-coverage
      badge_svg: coverage.svg
