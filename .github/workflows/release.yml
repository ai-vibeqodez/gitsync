# Release — build binaries, promote changelog, and publish GitHub Release
#
# Triggered on:
#   - Tag push (v*)
#   - Manual workflow_dispatch for dry-run or override version
#
# Steps:
#   1. Build Linux binary (Clang 18 + libc++) in ci-cpp23 container
#   2. Build Windows binary (MSVC) on windows-latest runner
#   3. Collect artifacts and delegate to reusable-release.yml

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); use auto to derive from CHANGELOG.md'
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build/release
          build_preset: release
          build_type: Release

      - name: Strip binary
        run: strip build/release/gitsync

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-linux
          path: build/release/gitsync
          if-no-files-found: error

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure
        shell: pwsh
        run: cmake --preset msvc -B build/msvc

      - name: Build
        shell: pwsh
        run: cmake --build build/msvc --config Release --target gitsync

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-windows
          path: build/msvc/Release/gitsync.exe
          if-no-files-found: error

  collect-artifacts:
    name: Collect release artifacts
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-windows
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/gitsync artifacts/gitsync-linux-x64
          mv artifacts/gitsync.exe artifacts/gitsync-windows-x64.exe
          ls -lah artifacts/

      - name: Upload final artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-release-binaries
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish release
    needs: collect-artifacts
    uses: ai-warevo/.github/.github/workflows/reusable-release.yml@main
    with:
      version: ${{ inputs.version || 'auto' }}
      artifact_name: gitsync-release-binaries
      artifact_directory: artifacts
    permissions:
      contents: write
      actions: write
