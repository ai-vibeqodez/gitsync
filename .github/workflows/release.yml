# Release — build binaries, promote changelog, and publish GitHub Release
#
# Triggered on:
#   - Tag push (v*)
#   - Manual workflow_dispatch for dry-run or override version
#
# When triggered via workflow_dispatch:
#   - Generates CHANGELOG.md from git log
#   - Builds binaries for Linux + Windows
#   - Publishes release with artifacts

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); use auto to derive from CHANGELOG.md'
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build/release
          build_type: Release
          extra_args: -DGITSYNC_BUILD_TESTS=OFF

      - name: Strip binary
        run: strip build/release/gitsync

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-linux
          path: build/release/gitsync
          if-no-files-found: error

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Import code signing certificate
        shell: powershell
        timeout-minutes: 5
        run: |
          $cert_b64 = "${{ secrets.SIGNING_CERTIFICATE }}"
          if (-not $cert_b64) {
            Write-Host "SIGNING_CERTIFICATE not configured; skipping certificate import"
            exit 0
          }

          # Decode base64 certificate
          $certBytes = [System.Convert]::FromBase64String($cert_b64)
          $certPath = Join-Path $env:TEMP "gitsync_cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)

          # Import to CurrentUser\My store
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password (ConvertTo-SecureString "${{ secrets.CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
          Write-Host "Certificate imported: $($cert.Subject)"

          # Also import to Trusted Root and Trusted Publishers (LocalMachine skips the GUI prompt)
          $rootStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "LocalMachine")
          $rootStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $rootStore.Add($cert)
          $rootStore.Close()

          $pubStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPublisher", "LocalMachine")
          $pubStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $pubStore.Add($cert)
          $pubStore.Close()

          Remove-Item $certPath

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build/msvc
          build_type: Release
          config: Release
          extra_args: -DGITSYNC_BUILD_TESTS=OFF

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-windows
          path: build/msvc/Release/gitsync.exe
          if-no-files-found: error

  collect-artifacts:
    name: Collect release artifacts
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-windows
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/gitsync artifacts/gitsync-linux-x64
          mv artifacts/gitsync.exe artifacts/gitsync-windows-x64.exe
          ls -lah artifacts/

      - name: Upload final artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-release-binaries
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish release
    needs: collect-artifacts
    uses: ai-warevo/.github/.github/workflows/reusable-release.yml@main
    with:
      version: ${{ inputs.version || 'auto' }}
      artifact_name: gitsync-release-binaries
      artifact_directory: artifacts
      what-included: |
        - Multi-platform binaries: Linux (x64) and Windows (x64)
        - Cross-platform Git repository synchronization utility
        - Multi-layer configuration system (global → org → repo)
        - SSH known_hosts automatic management
        - Template-based branch naming
      quick-start: |
        **Download the binary for your platform:**
        - Linux: `gitsync-linux-x64`
        - Windows: `gitsync-windows-x64.exe`

        **Quick setup:**
        ```bash
        # Make executable (Linux)
        chmod +x gitsync-linux-x64
        sudo mv gitsync-linux-x64 /usr/local/bin/gitsync

        # Create config
        mkdir -p ~/.gitsync
        cat > ~/.gitsync/config.json <<EOF
        {
          "LogLevel": "info",
          "SourceRemoteName": "origin",
          "RemoteBranchTemplate": "%owner%/%reponame%/%branchname%",
          "RemoteUrls": {
            "backup": "git@github.com:username/backup.git"
          }
        }
        EOF

        # Run sync
        gitsync
        ```

        See [README.md](https://github.com/ai-warevo/gitsync#readme) for full documentation.
    permissions:
      contents: write
      actions: write
