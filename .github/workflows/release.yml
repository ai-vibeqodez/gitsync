# Release — build binaries, promote changelog, and publish GitHub Release
#
# Triggered on:
#   - Tag push (v*)
#   - Manual workflow_dispatch for dry-run or override version
#
# Steps:
#   1. Build Linux binary (Clang 18 + libc++) in ci-cpp23 container
#   2. Build Windows binary (MSVC) on windows-latest runner
#   3. Collect artifacts and delegate to reusable-release.yml

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); use auto to derive from CHANGELOG.md'
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build/release
          build_preset: release
          build_type: Release
          extra_args: -DGITSYNC_BUILD_TESTS=OFF

      - name: Strip binary
        run: strip build/release/gitsync

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-linux
          path: build/release/gitsync
          if-no-files-found: error

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build/msvc
          build_type: Release
          config: Release
          extra_args: -DGITSYNC_BUILD_TESTS=OFF

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-windows
          path: build/msvc/Release/gitsync.exe
          if-no-files-found: error

  collect-artifacts:
    name: Collect release artifacts
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-windows
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/gitsync artifacts/gitsync-linux-x64
          mv artifacts/gitsync.exe artifacts/gitsync-windows-x64.exe
          ls -lah artifacts/

      - name: Upload final artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-release-binaries
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: collect-artifacts
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-release-binaries
          path: artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum gitsync-linux-x64 gitsync-windows-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Release Notes (without defaults)
        id: changelog
        uses: ai-warevo/.github/.github/actions/changelog-release@main
        with:
          tag: ${{ github.ref_name }}
          what-included: ''
          quick-start: ''

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: gitsync ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            artifacts/gitsync-linux-x64
            artifacts/gitsync-windows-x64.exe
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
